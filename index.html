
<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6533801722336189"
     crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        /* 改進的樣式：使用現代設計，添加顏色、陰影、響應式佈局 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .wrapper {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 20px;
        }

        .side-ad {
            width: 160px; /* 標準側邊廣告寬度，如 160x600 */
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
            position: sticky;
            top: 20px;
        }

        .side-ad p {
            margin: 0;
            color: #777;
            font-style: italic;
        }

        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .main-content {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .left-column {
            flex: 1;
            min-width: 300px;
        }

        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #007bff;
            outline: none;
        }

        .checkbox-group label {
            font-weight: normal;
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            margin-right: 10px;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .action-buttons button {
            flex: 1;
            margin-right: 10px;
        }

        .action-buttons button:last-child {
            margin-right: 0;
        }

        p.results-label {
            font-weight: bold;
            margin: 0 0 10px;
            color: #555;
        }

        pre {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        /* 響應式設計：小螢幕時隱藏側邊廣告並變成單欄 */
        @media (max-width: 1200px) {
            .side-ad {
                display: none;
            }

            .wrapper {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 800px) {
            .main-content {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .action-buttons button:last-child {
                margin-bottom: 0;
            }
        }
    </style>
    <!-- Google AdSense 腳本：請替換為您的 AdSense 代碼 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>
</head>
<body>

    <div class="wrapper">
        <!-- 左側廣告 -->
        <div class="side-ad">
            <!-- 替換為您的 AdSense 廣告單元代碼，例如側邊廣告 -->
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="YYYYYYYYYY" <!-- 使用不同的 slot 如果需要 -->
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
            <!-- 如果還未設定 AdSense，可用佔位符 -->
            <!-- <p>[Google Ad Placeholder - Left]</p> -->
        </div>

        <!-- 中心內容 -->
        <div class="container">
            <h1>Password Generator</h1>

            <div class="main-content">
                <!-- 左欄：輸入表單和生成按鈕 -->
                <div class="left-column">
                    <form>
                        <div>
                            <label for="number">Number of Passwords (1-10000):</label>
                            <input type="number" id="number" min="1" max="10000" value="1">
                        </div>

                        <div>
                            <label for="length">Password Length (8-50):</label>
                            <input type="number" id="length" min="8" max="50" value="12">
                        </div>

                        <div class="checkbox-group">
                            <label>Include:</label>
                            <label><input type="checkbox" id="upper" checked> Uppercase Letters (A-Z)</label>
                            <label><input type="checkbox" id="lower" checked> Lowercase Letters (a-z)</label>
                            <label><input type="checkbox" id="digits" checked> Digits (0-9)</label>
                            <label><input type="checkbox" id="symbols"> Symbols (!@#$%)</label>
                            <label><input type="checkbox" id="exclude"> Exclude Ambiguous Characters (o, 0, i, l, 1)</label>
                        </div>

                        <button type="button" id="generate">Generate Passwords</button>
                    </form>
                </div>

                <!-- 右欄：動作按鈕和密碼顯示 -->
                <div class="right-column">
                    <div class="action-buttons">
                        <button id="download">Download as CSV</button>
                        <button id="copy">Copy All</button>
                    </div>

                    <p class="results-label">Generated Passwords:</p>
                    <pre id="passwords"></pre>
                </div>
            </div>
        </div>

        <!-- 右側廣告 -->
        <div class="side-ad">
            <!-- 替換為您的 AdSense 廣告單元代碼，例如側邊廣告 -->
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="ZZZZZZZZZZ" <!-- 使用不同的 slot 如果需要 -->
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
            <!-- 如果還未設定 AdSense，可用佔位符 -->
            <!-- <p>[Google Ad Placeholder - Right]</p> -->
        </div>
    </div>

    <script>
        // 定義字符池
        const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
        const digitChars = '0123456789';
        const symbolChars = '!@#$%';

        // 生成密碼按鈕事件
        document.getElementById('generate').addEventListener('click', () => {
            const num = parseInt(document.getElementById('number').value);
            const len = parseInt(document.getElementById('length').value);
            const includeUpper = document.getElementById('upper').checked;
            const includeLower = document.getElementById('lower').checked;
            const includeDigits = document.getElementById('digits').checked;
            const includeSymbols = document.getElementById('symbols').checked;
            const exclude = document.getElementById('exclude').checked;

            // 驗證輸入
            if (isNaN(num) || num < 1 || num > 10000 || isNaN(len) || len < 8 || len > 50) {
                alert('Please enter valid number of passwords (1-10000) and length (8-50)');
                return;
            }

            // 根據排除選項調整字符池
            let upperPool = upperChars;
            let lowerPool = lowerChars;
            let digitPool = digitChars;
            let symbolPool = symbolChars;

            if (exclude) {
                upperPool = upperPool.replace(/[OIL]/g, ''); // 額外排除大寫易混淆字符
                lowerPool = lowerPool.replace(/[oil]/g, '');
                digitPool = digitPool.replace(/[01]/g, '');
            }

            // 所有可用字符的聯合池
            let allPool = '';
            if (includeUpper) allPool += upperPool;
            if (includeLower) allPool += lowerPool;
            if (includeDigits) allPool += digitPool;
            if (includeSymbols) allPool += symbolPool;

            if (allPool === '') {
                alert('Please select at least one character type');
                return;
            }

            // 需要至少一個的字符池列表
            const requiredPools = [];
            if (includeUpper) requiredPools.push(upperPool);
            if (includeLower) requiredPools.push(lowerPool);
            if (includeDigits) requiredPools.push(digitPool);
            if (includeSymbols) requiredPools.push(symbolPool);

            // 生成密碼
            const passwords = [];
            for (let i = 0; i < num; i++) {
                let pwArray = [];

                // 先為每個要求的類型選一個字符
                for (const pool of requiredPools) {
                    const char = pool[Math.floor(Math.random() * pool.length)];
                    pwArray.push(char);
                }

                // 填充剩餘長度，從聯合池隨機選
                for (let j = pwArray.length; j < len; j++) {
                    const char = allPool[Math.floor(Math.random() * allPool.length)];
                    pwArray.push(char);
                }

                // 打亂順序
                pwArray.sort(() => Math.random() - 0.5);

                passwords.push(pwArray.join(''));
            }

            // 顯示密碼
            document.getElementById('passwords').innerText = passwords.join('\n');
        });

        // 複製全部按鈕事件
        document.getElementById('copy').addEventListener('click', () => {
            const text = document.getElementById('passwords').innerText;
            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('All passwords copied');
                }).catch(() => {
                    alert('Copy failed, please select and copy manually');
                });
            } else {
                alert('No passwords generated');
            }
        });

        // 下載為 CSV 按鈕事件（改為 CSV 以避免引入額外庫）
        document.getElementById('download').addEventListener('click', () => {
            const text = document.getElementById('passwords').innerText;
            if (text) {
                const csvContent = 'Password\n' + text.replace(/\n/g, '\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'passwords.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } else {
                alert('No passwords generated');
            }
        });
    </script>

</body>
</html>
